apiVersion: 1

datasources:
  - name: InfluxDB
    uid: influxdb
    type: influxdb
    access: proxy
    url: http://influxdb:8086
    secureJsonData:
      token: "my-super-secret-auth-token"
    jsonData:
      version: Flux
      organization: "myorg"
      defaultBucket: "threads"
      tlsSkipVerify: true
    editable: true